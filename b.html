header.top{background:var(--paper);color:var(--ink);backdrop-filter:none;-webkit-backdrop-filter:none;

.live.on{background:#8E1B12;box-shadow:0 0 0 3px rgba(142,27,18,.25)}

var lastSync='';
var tab=ss('cj-tab')||'sched', filter=ls('cj-filter')||'', cursor=+(ss('cj-cursor')||0);
function isAdmin(){return !!cred}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var SHEET={}, sheetAt='';
function sc(k){var v=state.scores[k]||SHEET[k]||BASE[k];return v&&typeof v.a==='number'&&typeof v.b==='number'?v:null}
function nm(n){return esc(n)}

/* ---------- 計算 ---------- */
function compute(){
  var st={}; Object.keys(TEAM).forEach(function(n){st[n]={n:n,l:TEAM[n],p:0,w:0,ls:0,d:0,pts:0,inn:0,opp:0}});
  var h2h={},played=0;
  PRE.forEach(function(r,i){[["A",r[0],r[1]],["B",r[2],r[3]]].forEach(function(m){
    var v=sc('p'+(i+1)+m[0]); if(!v) return; played++;
    var a=st[m[1]],b=st[m[2]]; a.p++;b.p++; a.inn+=v.a;a.opp+=v.b;b.inn+=v.b;b.opp+=v.a;
    if(v.a>v.b){a.w++;b.ls++}else if(v.b>v.a){b.w++;a.ls++}else{a.d++;b.d++}
    h2h[m[1]+'|'+m[2]]=[v.a,v.b];h2h[m[2]+'|'+m[1]]=[v.b,v.a];
  })});
  Object.keys(st).forEach(function(n){var r=st[n];r.pts=r.w*2+r.d;r.key=r.pts*100+r.inn+(+state.adj[n]||0)});
  var rank={},lg={},tied={};
  LK.forEach(function(l){
    var arr=LEAGUES[l].map(function(n){return st[n]}).sort(function(x,y){return (y.key-x.key)||(x.n<y.n?-1:1)});
    arr.forEach(function(r,i){r.rank=i+1;rank[l+(i+1)]=r.n;});
    arr.forEach(function(r){r.tied=r.p>0&&arr.some(function(o){return o!==r&&o.key===r.key})});
    lg[l]=arr;
  });
  var leagueDone={};LK.forEach(function(l){leagueDone[l]=lg[l].every(function(r){return r.p===3})});
  var allDone=played===36;
  var thirds=LK.map(function(l){return lg[l][2]}).sort(function(x,y){return (y.key-x.key)||(x.l<y.l?-1:1)});
  thirds.forEach(function(r,i){r.trank=i+1;r.ttied=thirds.some(function(o){return o!==r&&o.key===r.key})});
  // トーナメント
  var T={};
  function seed(code){
    if(!code) return null;
    var m=/^([A-F])([1-4])$/.exec(code); if(m) return leagueDone[m[1]]?rank[code]:null;
    m=/^3rd(\d)$/.exec(code); if(m) return allDone?thirds[+m[1]-1].n:null;
    m=/^([WL])(\d+)([AB])$/.exec(code); if(m){var t=T[m[2]+m[3]];return t?(m[1]==='W'?t.win:t.lose):null;}
    return null;
  }
  TOUR.forEach(function(r,i){[["A",r[0],r[1]],["B",r[2],r[3]]].forEach(function(m){
    if(!m[1]) return; var id=(i+1)+m[0], a=seed(m[1]), b=seed(m[2]), v=sc('t'+id), o={id:id,a:a,b:b,ca:m[1],cb:m[2],v:v};
    if(a&&b&&v){ var aw=v.a>v.b?true:v.b>v.a?false:(v.w==='a'?true:v.w==='b'?false:null); if(aw!==null){o.win=aw?a:b;o.lose=aw?b:a;o.aw=aw;} }
    T[id]=o;
  })});
  var final=FINAL.map(function(f){var t=T[f[0]];return t?(f[1]==='w'?t.win:t.lose)||null:null});
  return {st:st,lg:lg,thirds:thirds,allDone:allDone,leagueDone:leagueDone,played:played,T:T,final:final,h2h:h2h};
}
function label(code){
  if(!code) return '';
  var m=/^([A-F])([1-4])$/.exec(code); if(m) return m[1]+'リーグ'+m[2]+'位';
  m=/^3rd(\d)$/.exec(code); if(m) return '各リーグ3位の'+'①②③④⑤⑥'[+m[1]-1];
  m=/^([WL])(\d+)([AB])$/.exec(code); if(m) return m[3]+m[2]+(m[1]==='W'?'勝者':'敗者');
  return code;
}
function matches(C){
  var out=[];
  PRE.forEach(function(r,i){out.push({key:'p'+(i+1)+'A',court:'A',slot:i,no:i+1,stage:'予選 第'+(i+1)+'試合',a:r[0],b:r[1],sub:TEAM[r[0]]+'リーグ'});
    out.push({key:'p'+(i+1)+'B',court:'B',slot:i,no:i+1,stage:'予選 第'+(i+1)+'試合',a:r[2],b:r[3],sub:TEAM[r[2]]+'リーグ'});});
  TOUR.forEach(function(r,i){["A","B"].forEach(function(c){var t=C.T[(i+1)+c]; if(!t) return;
    out.push({key:'t'+t.id,court:c,slot:18+i,no:i+1,stage:'決勝T 第'+(i+1)+'試合',a:t.a,b:t.b,pa:label(t.ca),pb:label(t.cb),sub:STAGE[t.id]||'',tour:true,fin:t.id==='23A'});});});
  return out;
}

/* ---------- 表示 ---------- */
function teamRow(t,ph,s,w,ex){return '<div class="row'+(w?' w':'')+(filter&&t===filter?' hl':'')+'"><span class="tn'+(t?'':' ph')+'">'+(t?nm(t):esc(ph))+'</span><span class="sc">'+(s==null?'–':s)+(ex||'')+'</span></div>'}
function matchHTML(m,nextKey){
  if(!m) return '<div class="match empty">試合なし</div>';
  var v=sc(m.key), aw=null;
  if(v){aw=v.a>v.b?true:v.b>v.a?false:(v.w==='a'?true:v.w==='b'?false:null)}
  var inv=filter&&!(m.a===filter||m.b===filter);
  var vp=function(side){return v&&v.a===v.b&&v.w===side?'<small class="vp">V</small>':''};
  return '<div class="match'+(inv?' dim':'')+'"><span class="court '+m.court.toLowerCase()+'"><i>'+m.court+'</i><span class="stage">'+esc(m.sub||'')+'</span></span>'+(m.key===nextKey?'<div class="nextline"><span class="pill">次の試合</span></div>':'')+
    teamRow(m.a,m.pa,v?v.a:null,aw===true,vp('a'))+teamRow(m.b,m.pb,v?v.b:null,aw===false,vp('b'))+(v&&v.a===v.b&&!v.w?'<div class="ref">引き分け</div>':'')+(m.fin?'<div class="ref">5分3セットマッチ（数字は取ったセット数）</div>':'')+'</div>';
}
function viewSched(C){
  var ms=matches(C), nextKey=null;
  ms.forEach(function(m){if(!nextKey&&m.a&&m.b&&!sc(m.key))nextKey=m.key});
  var h='<div style="display:grid;gap:8px"><h2>航海日誌｜試合進行表</h2><p class="note">予選・順位決定トーナメントは5分1セットマッチ、決勝戦は5分3セットマッチ。数字は試合終了時の内野人数です。チームを選ぶとそのチームの試合が分かります。</p>'+
   '<select id="team-filter" class="sel" aria-label="チームで絞り込む"><option value="">全チームを表示</option>'+LK.map(function(l){return '<optgroup label="'+l+'リーグ">'+LEAGUES[l].map(function(n){return '<option'+(filter===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</optgroup>'}).join('')+'</select></div>';
  h+='<div class="courthead" aria-hidden="true"><span class="a">Aコート</span><span class="b">Bコート</span></div>';
  for(var s=0;s<41;s++){
    if(s===18) h+='<div class="break">予選リーグの結果発表 → 順位決定トーナメントへ出航</div>';
    var row=ms.filter(function(m){return m.slot===s}); if(!row.length) continue;
    if(filter&&!row.some(function(m){return m.a===filter||m.b===filter})) continue;
    var A=row.filter(function(m){return m.court==='A'})[0]||null,B=row.filter(function(m){return m.court==='B'})[0]||null;
    h+='<section class="slot"><div class="slot-h"><span class="time">'+(s<18?'予選':'決勝T')+'</span><span class="lbl">第'+row[0].no+'試合'+(STAGE[row[0].no+'A']&&!STAGE[row[0].no+'B']?'・'+STAGE[row[0].no+'A']:'')+'</span></div><div class="courts">'+matchHTML(A,nextKey)+(B?matchHTML(B,nextKey):'<div class="match empty">－</div>')+'</div></section>';
  }
  return h;
}
function viewLeague(C){

    h+='<div class="card"><h3 class="lg">'+l+'リーグ'+(C.leagueDone[l]?'<span class="done">確定</span>':'')+'</h3><div class="tbl-wrap"><table class="tbl-fit"><colgroup><col style="width:10%"><col style="width:36%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:10%"><col style="width:10%"></colgroup><thead><tr><th>順位</th><th class="name">チーム</th><th>勝</th><th>負</th><th>分</th><th>勝点</th><th>内野</th><th>相手<br>内野</th></tr></thead><tbody>'+
      arr.map(function(r){var on=r.p>0;return '<tr><td class="rk'+(on&&r.rank===1?' rk1':'')+'">'+(on?r.rank:'–')+'</td><td class="name">'+nm(r.n)+(r.tied?'<span class="tie">同点・本部判断</span>':'')+(isAdmin()&&r.tied?adjBtn(r.n):'')+'</td><td>'+r.w+'</td><td>'+r.ls+'</td><td>'+r.d+'</td><td>'+r.pts+'</td><td>'+r.inn+'</td><td>'+r.opp+'</td></tr>'}).join('')+'</tbody></table></div>';
    h+='<div class="tbl-wrap"><table class="mx tbl-fit"><colgroup><col style="width:32%"><col><col><col><col></colgroup><thead><tr><th class="name">対戦</th>'+arr.map(function(_,i){return '<th>'+'①②③④'[LEAGUES[l].indexOf(LEAGUES[l][i])]+'</th>'}).join('')+'</tr></thead><tbody>'+
      LEAGUES[l].map(function(a,i){return '<tr><td class="name"><span class="no">'+'①②③④'[i]+'</span>'+nm(a)+'</td>'+LEAGUES[l].map(function(b){if(a===b)return '<td class="diag"></td>';var v=C.h2h[a+'|'+b];return v?'<td><span class="'+(v[0]>v[1]?'o':v[0]<v[1]?'x':'d')+'">'+(v[0]>v[1]?'〇':v[0]<v[1]?'×':'△')+'</span><small>'+v[0]+'-'+v[1]+'</small></td>':'<td><small>–</small></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div>';
  });
  h+='<div class="card"><h3 class="lg">各リーグ3位の順位'+(C.allDone?'<span class="done">確定</span>':'')+'</h3><p class="note">勝点 → 内野数の合計で①〜⑥を決めます。①〜④は上位トーナメント、⑤⑥は下位トーナメントへ。</p><div class="tbl-wrap"><table class="tbl-fit"><colgroup><col style="width:12%"><col style="width:46%"><col style="width:14%"><col style="width:14%"><col style="width:14%"></colgroup><thead><tr><th>順</th><th class="name">チーム</th><th>勝点</th><th>内野</th><th>相手<br>内野</th></tr></thead><tbody>'+
    C.thirds.map(function(r){return '<tr class="'+(r.trank<=4?'adv':'')+'"><td class="rk">'+'①②③④⑤⑥'[r.trank-1]+'</td><td class="name">'+(C.leagueDone[r.l]?nm(r.n):'<span class="ph">'+r.l+'リーグ3位</span>')+'<small class="lgtag">'+r.l+'</small>'+(r.ttied&&r.p?'<span class="tie">同点・本部判断</span>':'')+(isAdmin()&&r.ttied&&r.p?adjBtn(r.n):'')+'</td><td>'+r.pts+'</td><td>'+r.inn+'</td><td>'+r.opp+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  return h;
}
function adjBtn(n){var a=+state.adj[n]||0;return '<span class="adj"><button type="button" class="mini" data-adj="'+esc(n)+'" data-d="0.1">上にする</button>'+(a?'<button type="button" class="mini" data-adj="'+esc(n)+'" data-d="0">戻す</button>':'')+'</span>'}

/* トーナメント表（SVG）：勝ち上がり=赤、敗退=水色 */
function seg(p,k){var col=k==='win'?'var(--path-win)':k==='lose'?'var(--path-lose)':'var(--path-none)';return '<polyline'+(k?' class="glow" style="color:'+col+'"':'')+' points="'+p+'" fill="none" stroke="'+col+'" stroke-width="'+(k?5:1.6)+'" stroke-linejoin="round" stroke-linecap="round"/>'}
function pc(t,side){if(!t||t.aw===undefined)return null;return (side==='a')===t.aw?'win':'lose'}
function est(s,z){var l=0;String(s).split('').forEach(function(c){l+=c.charCodeAt(0)>255?z:z*0.58});return l}
function svgName(x,y,t,z,maxw,cls){
  var sz=z; while(sz>7&&est(t,sz)>maxw) sz-=0.5;
  return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" text-anchor="middle"'+(cls?' class="'+cls+'"':'')+'>'+esc(t)+'</text>';
}
function stag(x,y,v){if(v==null)return '';return '<rect class="scbg" x="'+(x-11)+'" y="'+(y-10)+'" width="22" height="15" rx="3"/><text x="'+x+'" y="'+(y+1.5)+'" font-size="10.5" text-anchor="middle" class="sct">'+v+'</text>'}
// 4チームの山（1回戦2試合→勝者同士の決勝）を描く
function bracket4(C,title,r1a,r1b,fin,third,places){
  var T=C.T, x=[34,113,197,276], yB=210, yS=140, yF=70, j1=(x[0]+x[1])/2, j2=(x[2]+x[3])/2, cx=(j1+j2)/2;
  var A=T[r1a],B=T[r1b],F=T[fin],H=T[third];
  var h='<svg class="bk" viewBox="0 0 310 300" role="img" aria-label="'+esc(title)+'">';
  [[A,x[0],x[1],j1],[B,x[2],x[3],j2]].forEach(function(g){h+=seg(g[1]+','+yB+' '+g[1]+','+yS+' '+g[3]+','+yS,pc(g[0],'a'))+seg(g[2]+','+yB+' '+g[2]+','+yS+' '+g[3]+','+yS,pc(g[0],'b'))});
  h+=seg(j1+','+yS+' '+j1+','+yF+' '+cx+','+yF,A&&A.win?(pc(F,'a')||'win'):null)+seg(j2+','+yS+' '+j2+','+yF+' '+cx+','+yF,B&&B.win?(pc(F,'b')||'win'):null)+seg(cx+','+yF+' '+cx+',42',F&&F.win?'win':null);
  h+='<rect x="'+(cx-62)+'" y="6" width="124" height="36" rx="6" fill="url(#g-champ)"/><text x="'+cx+'" y="20" font-size="9" text-anchor="middle" class="champtx">'+places[0]+'</text>'+svgName(cx,36,F&&F.win?F.win:'—',13,114,'champtx');
  h+='<text x="'+cx+'" y="'+(yF-7)+'" font-size="9" text-anchor="middle" class="sub">'+fin.replace(/(\d+)([AB])/,'$2コート 第$1試合')+'</text>';
  h+='<text x="'+j1+'" y="'+(yS+14)+'" font-size="9" text-anchor="middle" class="sub">'+r1a.replace(/(\d+)([AB])/,'$2 第$1試合')+'</text><text x="'+j2+'" y="'+(yS+14)+'" font-size="9" text-anchor="middle" class="sub">'+r1b.replace(/(\d+)([AB])/,'$2 第$1試合')+'</text>';
  if(A&&A.v)h+=stag(x[0]+16,yS+34,A.v.a)+stag(x[1]-16,yS+34,A.v.b);
  if(B&&B.v)h+=stag(x[2]+16,yS+34,B.v.a)+stag(x[3]-16,yS+34,B.v.b);
  if(F&&F.v)h+=stag(j1+18,yF+24,F.v.a)+stag(j2-18,yF+24,F.v.b);
  [[A,'a'],[A,'b'],[B,'a'],[B,'b']].forEach(function(s,i){var t=s[0],n=t?t[s[1]]:null,ph=t?label(t['c'+s[1]]):'';
    h+='<rect class="box" x="'+(x[i]-36)+'" y="'+yB+'" width="72" height="54" rx="6"/>'+svgName(x[i],yB+16,ph,8.5,66,'sub')+svgName(x[i],yB+36,n||'未確定',n?11.5:9.5,66,n?'':'sub');});
  if(H){ h+='<text x="'+cx+'" y="'+(yB+76)+'" font-size="9.5" text-anchor="middle" class="sub">'+places[2]+'：'+(H.win?esc(H.win):'—')+'　'+places[3]+'：'+(H.lose?esc(H.lose):'—')+'（'+third.replace(/(\d+)([AB])/,'$2 第$1試合')+'）</text>'; }
  return '<div class="card"><h3 class="lg">'+esc(title)+'</h3>'+h+'</svg></div>';
}

// 全体のトーナメント表（左に出場チーム、右へ勝ち上がり）
function fullBracket(C,rootId,title,champ){
  var T=C.T, W=360, x0=118, leafGap=30, top=14;
  function depth(id){var t=T[id];if(!t)return 0;var m=0;['ca','cb'].forEach(function(k){var r=/^W(\d+[AB])$/.exec(t[k]||'');if(r)m=Math.max(m,depth(r[1])+1)});return m}
  var D=depth(rootId)+1, step=(W-24-x0)/D, leaves=0, body='';
  function jx(d){return x0+(D-d)*step}
  function draw(id,d){
    var t=T[id], ys={};
    ['a','b'].forEach(function(side){
      var code=t['c'+side], r=/^W(\d+[AB])$/.exec(code||''), y, fx, kind;
      if(r&&T[r[1]]){var ch=draw(r[1],d+1);y=ch.y;fx=jx(d+1);kind=ch.done?(pc(t,side)||'win'):null}
      else{y=top+leafGap*(leaves++)+leafGap/2;fx=x0;kind=pc(t,side);var n=t[side];
        var z=11.5;var lab=n||label(code);while(z>7.5&&est(lab,z)>x0-8)z-=0.5;
        body+='<text x="'+(x0-5)+'" y="'+(y+4)+'" font-size="'+z+'" text-anchor="end"'+(n?(t.win===n?' class="wn"':(t.lose===n?' class="ls"':'')):' class="sub"')+'>'+esc(lab)+'</text>'}
      ys[side]=y;
      body+=seg(fx+','+y+' '+jx(d)+','+y,kind);
      if(t.v){var sv=side==='a'?t.v.a:t.v.b;body+='<text x="'+(jx(d)-7)+'" y="'+(y-4)+'" font-size="10" text-anchor="end" class="sct2">'+sv+(t.v.a===t.v.b&&t.v.w===side?'V':'')+'</text>'}
    });
    var ym=(ys.a+ys.b)/2;
    body=seg(jx(d)+','+ys.a+' '+jx(d)+','+ym,pc(t,'a'))+seg(jx(d)+','+ys.b+' '+jx(d)+','+ym,pc(t,'b'))+body;
    body+='<text x="'+(jx(d)+3)+'" y="'+(ym-4)+'" font-size="7.5" class="sub">'+id.replace(/(\d+)([AB])/,'$2$1')+'</text>';
    return {y:ym,done:!!t.win};
  }
  var r=draw(rootId,0);
  body+=seg(jx(0)+','+r.y+' '+(W-6)+','+r.y,r.done?'win':null);
  var H=top*2+leafGap*leaves, w=T[rootId]&&T[rootId].win;
  return '<div class="card"><h3 class="lg">'+esc(title)+'</h3><div class="champline">'+champ+'：<b>'+(w?esc(w):'未確定')+'</b></div><svg class="bk" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">'+body+'</svg><p class="note">線の上の数字は内野数（VはVポイント勝ち）、小さい記号（A3など）はコートと試合番号です。</p></div>';
}
function tCard(C,id){var t=C.T[id];if(!t)return '';var v=t.v,aw=t.aw;
  return '<div class="match"><span class="court '+id.slice(-1).toLowerCase()+'"><i>'+id.slice(-1)+'</i><span class="stage">第'+id.slice(0,-1)+'試合'+(STAGE[id]?'・'+STAGE[id]:'')+'</span></span>'+teamRow(t.a,label(t.ca),v?v.a:null,aw===true,v&&v.a===v.b&&v.w==='a'?'<small class="vp">V</small>':'')+teamRow(t.b,label(t.cb),v?v.b:null,aw===false,v&&v.a===v.b&&v.w==='b'?'<small class="vp">V</small>':'')+'</div>'}
function viewTour(C){
  var h='<div style="display:grid;gap:6px"><h2>頂上への航路</h2><p class="note" style="margin-top:-4px">順位決定トーナメント</p><p class="note">'+(C.allDone?'予選の順位が確定しました。':'予選リーグがすべて終わると、チーム名が自動で入ります。')+' 全24チームの順位を決めます。</p><div class="legend"><span><i style="background:var(--path-win)"></i>勝ち上がり</span><span><i style="background:var(--path-lose)"></i>敗退</span><span><small class="vp">V</small>Vポイントで勝利</span></div></div>';

var SHEET_ID='1VnOSPS5PYyzPObvD99CnK5KDNtkzsmBYwVeI2hUiKlQ';
var sheetSeq=0;
function loadSheet(){
  return new Promise(function(resolve){
    var cb='__cjSheet'+(++sheetSeq), done=false, el=document.createElement('script');
    function fin(ok){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}el.remove();resolve(ok)}
    window[cb]=function(res){
      try{
        var rows=(res&&res.table&&res.table.rows)||[], out={};
        var num=function(c){if(!c||c.v===null||c.v===undefined||c.v==='')return null;var n=Number(String(c.v).replace(/[０-９]/g,function(d){return String.fromCharCode(d.charCodeAt(0)-65248)}));return isNaN(n)?null:n};
        var txt=function(c){return c&&c.v!=null?String(c.v).trim():''};
        var z2h=function(t){return t.replace(/[０-９]/g,function(d){return String.fromCharCode(d.charCodeAt(0)-65248)})};
        rows.forEach(function(r){
          var c=r.c||[], kind=txt(c[0]), m=/(\d+)/.exec(z2h(txt(c[1]))); if(!m) return;
          var n=+m[1], key=null;
          if(/予選/.test(kind)&&n>=1&&n<=18) key='p'+n;
          else if(/決勝/.test(kind)&&n>=1&&n<=23) key='t'+n;
          if(!key) return;
          // 予選はチーム名が組み合わせと一致するときだけ使う
          if(key[0]==='p'){var P=PRE[n-1]; if(txt(c[3])&&txt(c[3])!==P[0]) return;}
          var a1=num(c[4]),b1=num(c[6]),a2=num(c[10]),b2=num(c[12]);
          if(a1!==null&&b1!==null) out[key+'A']={a:a1,b:b1,w:null};
          if(a2!==null&&b2!==null) out[key+'B']={a:a2,b:b2,w:null};
        });
        // 同点で勝者がスプレッドシートにない試合は、これまでの勝者（管理者入力・取り込み済み）を引き継ぐ
        Object.keys(out).forEach(function(k){var o=out[k];if(o.a===o.b){var prev=BASE[k]||SHEET[k];if(prev&&prev.a===o.a&&prev.b===o.b)o.w=prev.w}});
        SHEET=out; var d=new Date(); sheetAt=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); fin(true);
      }catch(e){console.error(e);fin(false)}
    };
    el.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=responseHandler:'+cb+'&headers=0&range=A1:N60&sheet='+encodeURIComponent('試合進行表')+'&_='+Date.now();
    el.onerror=function(){fin(false)};
    setTimeout(function(){fin(false)},12000);
    document.head.appendChild(el);
  });
}

    if(rb.classList.contains('busy'))return;rb.classList.add('busy');rb.querySelector('.t span').textContent='更新中…';
    try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}
    Promise.all([loadSheet(),loadAll(),new Promise(function(r){setTimeout(r,700)})]).then(function(res){
      render();
      var b=document.getElementById('refresh');
      if(res[0]){if(b){b.classList.add('done');b.querySelector('.t span').textContent='更新しました'}toast('本部の記録表の最新結果を表示しています（'+sheetAt+'）');setTimeout(render,1600)}
      else{toast('記録表を読み込めませんでした。電波を確認してもう一度押してください')}
    });
    return}
  var id=e.target.id;
  if(id==='prev'||id==='next'){cursor+=id==='prev'?-1:1;ss('cj-cursor',String(cursor));render();return}
  if(id==='save-score'||id==='clear-score'){
    var ms=matches(compute()),m=ms[cursor];
    if(id==='clear-score'){ss('cj-draft',null);once(rpc('cj26_delete_result',{p_key:m.key}).then(function(r){if(r.error)throw r.error;delete state.scores[m.key];render();toast('結果を消しました')}).catch(werr));return}
    var a=parseInt(document.getElementById('score-0').value,10),b=parseInt(document.getElementById('score-1').value,10),wv=document.querySelector('input[name=vw]:checked'),w=wv?wv.value:null,msg=document.getElementById('entry-msg');
    if(isNaN(a)||isNaN(b)){msg.textContent='両チームの数字を入れてください。';msg.style.color='var(--warn)';return}
    if(m.tour&&a===b&&!w){msg.textContent='同点です。Vポイントで勝ったチームを選んでください。';msg.style.color='var(--warn)';return}
    if(a!==b)w=null;
    ss('cj-draft',null);var nx=Math.min(cursor+1,ms.length-1);
    once(rpc('cj26_save_result',{p_key:m.key,p_a:a,p_b:b,p_w:w}).then(function(r){if(r.error)throw r.error;state.scores[m.key]={a:a,b:b,w:w};cursor=nx;ss('cj-cursor',String(cursor));render();toast(m.a+' '+a+' - '+b+' '+m.b+' を保存しました')}).catch(werr));return}
  if(id==='reset-adj'){once(rpc('cj26_save_adj',{p_adj:{}}).then(function(r){if(r.error)throw r.error;state.adj={};render();toast('同点の調整を戻しました')}).catch(werr));return}
  if(id==='logout'){cred=null;ls('cj26-cred',null);tab='sched';ss('cj-tab',tab);render();toast('ログアウトしました')}
});
render();
if(ss('cj-refreshed')){ss('cj-refreshed',null);var sy=+(ss('cj-scroll')||0);setTimeout(function(){window.scrollTo(0,sy);toast('最新の結果に更新しました')},300)}
if(!CFG.SUPABASE_URL||!window.supabase){loadError='接続の準備ができていません。';render()}
else{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false}});loadAll();subscribe();loadSheet().then(function(ok){if(ok)render()});setInterval(function(){if(!document.hidden)loadSheet().then(function(ok){if(ok)render()})},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadAll()});setInterval(function(){if(!document.hidden)loadAll()},30000)}
})();
</script>
</body>
</html>
